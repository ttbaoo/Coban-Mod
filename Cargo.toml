[package]
name = "coban-mod"
version = "0.6.5"
edition = "2024"
rust-version = "1.92"
build = "build.rs"
description = "Coban-mod — Coban Pad 10A controller"
license = "MIT"
repository = "https://github.com/ttbaoo/Coban-Mod"

[lib]
name = "mk"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:rfd"]
internal-ui-qa = ["desktop"]

[dependencies]
anyhow = "1"
ab_glyph = "0.2.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
gif = "0.14"
color_quant = "1.1"
dirs = "6"
interprocess = "2.4.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device", "windows-native", "linux-native"] }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "accessibility", "system-tray", "unstable-winit-030"] }
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSBundle"] }

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "mk"
path = "src/main.rs"

[[bin]]
name = "mk-agent"
path = "src/agent_main.rs"

[[bin]]
name = "mk-ui-qa"
path = "src/qa_main.rs"
required-features = ["internal-ui-qa"]
